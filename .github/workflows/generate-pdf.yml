name: Generate Arabic Guide PDF

on:
  push:
    paths:
      - 'docs/arabic-guide.html'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Generate PDF
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          const path = require('path');
          const fs = require('fs');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();

            const htmlPath = path.resolve('docs/arabic-guide.html');
            await page.goto('file://' + htmlPath, { waitUntil: 'networkidle0' });

            // Wait for Noto Kufi Arabic font to load
            await page.evaluateHandle('document.fonts.ready');

            await page.pdf({
              path: 'docs/arabic-guide.pdf',
              format: 'A4',
              printBackground: false,
              margin: { top: '20mm', bottom: '20mm', left: '18mm', right: '18mm' }
            });

            await browser.close();
            console.log('PDF generated: docs/arabic-guide.pdf');
          })();
          "

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/arabic-guide.pdf
          git diff --cached --quiet || git commit -m "docs: auto-generate arabic-guide.pdf"
          git push
